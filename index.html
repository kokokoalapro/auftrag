<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Auftrag</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Auftragsseite: Die ganze Aufgabe steckt im Link hinter dem #. Kein Server speichert etwas, kein Konto, keine Kosten.
   Der Empfänger sieht, was zu tun ist, hakt Schritte ab und meldet sich per WhatsApp zurück. */
:root{--bg:#f6f4ee;--card:#ffffff;--fg:#1d2328;--dim:#5f6b72;--line:#e2ddd2;--akzent:#0e7c86;--gold:#b7791f;--ok:#2f8f5b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1417;--card:#161d22;--fg:#e6edf0;--dim:#93a3ab;--line:#26333a;--akzent:#62d2dd;--gold:#f2b84b;--ok:#5fe0a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1417;--card:#161d22;--fg:#e6edf0;--dim:#93a3ab;--line:#26333a;--akzent:#62d2dd;--gold:#f2b84b;--ok:#5fe0a0;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.55 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.von{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.karte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
h1{font-size:clamp(22px,5.5vw,28px);line-height:1.25;margin:4px 0 10px;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim)}.chip.frist{color:var(--gold);border-color:var(--gold)}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
p{margin:0}
ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ol label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
ol input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);flex:none}ol input:checked+span{text-decoration:line-through;color:var(--dim)}
.knoepfe{display:flex;flex-direction:column;gap:10px}
a.knopf{display:block;text-align:center;text-decoration:none;font-weight:600;padding:14px;border-radius:10px;border:1px solid var(--akzent);color:var(--akzent)}
a.knopf.voll{background:var(--akzent);color:#fff}
.klein{font-size:13px;color:var(--dim);text-align:center}
.fehler{color:var(--dim)}
</style></head><body><main id="m"></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lies(){try{const h=location.hash.slice(1);if(!h)return null;const b=h.replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(decodeURIComponent(escape(atob(b))))}catch(e){return null}}
const a=lies(),m=document.getElementById("m");
if(!a){m.innerHTML=`<div class="karte"><h1>Auftragsseite</h1><p class="fehler">Dieser Link enthält keinen Auftrag. Du bekommst den vollständigen Link von der Person, die dich um etwas bittet, meist per WhatsApp.</p></div>`}
else{
  const frist=a.f?new Date(a.f+"T00:00:00"):null,tage=frist?Math.round((frist-new Date(new Date().toDateString()))/864e5):null;
  const fristTxt=frist?frist.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})+(tage===0?" (heute)":tage>0?` (in ${tage} Tagen)`:` (seit ${-tage} Tagen vorbei)`):"";
  const schluessel="auftrag."+location.hash.slice(1,41);let haken=[];try{haken=JSON.parse(localStorage.getItem(schluessel)||"[]")}catch(e){}
  const schritte=(a.s||[]).map((s,i)=>`<li><label><input type="checkbox" data-i="${i}" ${haken[i]?"checked":""}><span>${esc(s)}</span></label></li>`).join("");
  const name=a.n?`Hallo ${esc(a.n)},`:"Hallo,";const wer=a.v?`${esc(a.v)} bittet dich`:"jemand bittet dich";
  const antwort=encodeURIComponent(`Erledigt: ${a.t}`),frage=encodeURIComponent(`Frage zu „${a.t}“: `);
  m.innerHTML=`<div class="von">Auftrag${a.p?" · "+esc(a.p):""}</div>
  <div class="karte"><p>${name} ${wer} um Folgendes:</p><h1>${esc(a.t)}</h1>
   <div class="chips">${frist?`<span class="chip frist">bis ${fristTxt}</span>`:""}${a.p?`<span class="chip">${esc(a.p)}</span>`:""}</div></div>
  ${a.w?`<div class="karte"><h2>Worum es geht</h2><p>${esc(a.w)}</p></div>`:""}
  ${schritte?`<div class="karte"><h2>Schritte</h2><ol>${schritte}</ol><p class="klein" style="margin-top:10px;text-align:left">Die Haken merkt sich nur dein Gerät.</p></div>`:""}
  <div class="knoepfe"><a class="knopf voll" href="https://wa.me/?text=${antwort}" target="_blank" rel="noopener">Erledigt melden (WhatsApp)</a><a class="knopf" href="https://wa.me/?text=${frage}" target="_blank" rel="noopener">Frage stellen</a>
   <p class="klein">Beides öffnet WhatsApp mit einem vorgeschriebenen Text; du wählst den Chat selbst. Diese Seite speichert nichts und sendet nichts.</p></div>`;
  m.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.onchange=()=>{haken[+cb.dataset.i]=cb.checked;try{localStorage.setItem(schluessel,JSON.stringify(haken))}catch(e){}});
  document.title="Auftrag: "+a.t.slice(0,40);
}
</script></body></html>
